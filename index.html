<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>marmar &amp; kinkin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">
  <img src="images/hero.jpg" alt="marmar and kinkin">
  <div class="script">marmar &amp; kinkin</div>
  <p>just for us</p>
  <div id="counter"></div>
</section>

<!-- MONTHSARY: counts down to the next 17th, heart beats faster on the day -->
<section class="monthsary">
  <p class="section-label">Monthsary</p>
  <svg class="heart" id="heart" viewBox="0 0 24 24" role="img" aria-label="beating heart">
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
  </svg>
  <h2 id="ms-title" class="center">our next monthsary</h2>
  <div id="ms-days" class="big-number"></div>
  <p id="ms-sub" class="caption"></p>
</section>

<!-- ANNIVERSARY: locked until Dec 12, 2026 (add ?preview=recap to the link to peek) -->
<section class="anniversary">
  <p class="section-label">1st Anniversary</p>
  <div id="recap-lock" class="lock-card">
    <div class="script" id="anniv-title">our 1st anniversary</div>
    <p id="anniv-sub" class="caption"></p>
